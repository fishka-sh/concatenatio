
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href={% static 'css/nav.css' %}>
    <link rel="stylesheet" href={% static 'css/interesting.css' %}>
    <link rel="stylesheet" href={% static 'css/katalog.css' %}>
    <link rel="stylesheet" href={% static 'css/main.css' %}>
    <link rel="stylesheet" href={% static 'css/footer.css' %}>
    <link rel="stylesheet" href={% static 'fonts/Tsarevich_Old/Tsarevich_Old.ttf' %} media="screen">
    <link rel="stylesheet" href={% static 'fonts/Codec_Pro_Variable/4_CodecProMEVariable.ttf' %} media="screen">
</head>
<body>

    <header>


        <div class="hamburger-menu">
            <input id="menu__toggle" type="checkbox" />
            <label class="menu__btn" for="menu__toggle">
                <span></span>
            </label>

            <ul class="menu__box">
                <li><a class="menu__item" href="item/1">Главная</a></li>
                <li><a class="menu__item" href="catalog">Каталог</a></li>
                <li><a class="menu__item" href="#">О нас</a></li>
                <li><a class="menu__item" href="#">Брелоки</a></li>
                <li><a class="menu__item" href="#">Значки</a></li>
                <li><a class="menu__item" href="#">Стикеры</a></li>
                <li><a class="menu__item" href="#">Открытки</a></li>
                <li><a class="menu__item" href="#">Войти</a></li>
                <li><a class="menu__item" href="#">Регистрация</a></li>

            </ul>
        </div>
        
        <main class="container" id="item">
            <div class="row sg-row">
                {% for item in item_list %}
                <div class="col-3">
                    <div class="card sg-card item-card" onclick="window.location = '/item/{{ item.id }}'">
                        <img class="sg-img-padding item-img" src={{ item.item_image.url }} id='img-{{ item.id }}' >
                        <h1 class="Tsarevichold ne-price item-title">{{ item.item_title }}</h1>
                        <p class="price CodecProVariable">{{ item.item_price }} р.</p>
                        <button><a href='/item/{{ item.id }}' class="button-price CodecProVariable"> {{ item.item_price }} Добавить в корзину English</a></button>
                    </div>
                </div>
                {% endfor %}
            </div>
        </main>
    </header>




    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>    
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        
    <script srs={% static 'js/img-change.js' %}></script>


</body>
</html>
