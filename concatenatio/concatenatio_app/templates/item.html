{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href={% static 'css/nav.css' %}>
    
    <link rel="stylesheet" href={% static 'css/interesting.css' %}>
    <link rel="stylesheet" href={% static 'css/katalog.css' %}>
    <link rel="stylesheet" href={% static 'css/main.css' %}>
    <link rel="stylesheet" href={% static 'css/footer.css' %}>
    <link rel="stylesheet" href={% static 'css/item.css' %}>
    <link rel="stylesheet" href={% static 'fonts/Tsarevich_Old/Tsarevich_Old.ttf' %} media="screen">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

    <header>
        <div class="hamburger-menu">
            <input id="menu__toggle" type="checkbox" />
            <label class="menu__btn" for="menu__toggle">
                <span></span>
            </label>

            <ul class="menu__box">
                <li><a class="menu__item" href="#">Главная</a></li>
                <li><a class="menu__item" href="#">Каталог</a></li>
                <li><a class="menu__item" href="#">О нас</a></li>
                <li><a class="menu__item" href="#">Брелоки</a></li>
                <li><a class="menu__item" href="#">Значки</a></li>
                <li><a class="menu__item" href="#">Стикеры</a></li>
                <li><a class="menu__item" href="#">Открытки</a></li>
                <li><a class="menu__item" href="#">Войти</a></li>
                <li><a class="menu__item" href="#">Регистрация</a></li>

            </ul>
        </div>
        <div class="row">
            <div class="col-5">
                <img src={{ image.url }} class='item-image'>   
            </div>
            <div class="col-5">
                <main class='item-title Tsarevichold'>{{ title }}</main>
                <main class='item-price'>Цена: {{ price }}₽</main>
                <main class='item-description'>Описание: {{ description }}</main>
                <main class='item-quantity'>В наличии: {{ quantity }} штук</main>
                <button class='item-button'>В корзину</button><button class='item-button-heart'>.</button>
            </div>
        </div>


    </header>
</body>
</html>
