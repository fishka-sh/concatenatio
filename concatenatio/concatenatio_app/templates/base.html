{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block  title %}Магазин мерча{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    {% block css %}{% endblock %}
    <link rel="stylesheet" href={% static 'css/nav.css' %}>
    <link rel="stylesheet" href={% static 'css/footer.css' %}>

</head>
<body>

    {% include 'particles/nav.html' %}

    <main>
        {% block content %}{% endblock %}
    </main>

    {% include 'particles/footer.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>    
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script type='text/javascript' src={% static 'js/account.js' %}></script>
    <script src={% static 'js/svg-paste.js' %}></script>
    <script src={% static 'js/height.js' %}></script>

    {% block js %}{% endblock %}
</body>
</html>
