{% load static %}
<!DOCTYPE html>
<html>

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title></title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href={% static 'css/enter.css' %}>
        <link rel='icon' href={% static 'C:\Users\sofya\Desktop\concatenatio\concatenatio\concatenatio_app\static\img\icons8-шиншилла-24.png'%}>

    <body>
        {% csrf_token %}
        <main class='reg'>
            <label for='name' class='form-label enter'>Имя</label>
            <input type='name' class='form-control enter' id='name' placeholder='Введите имя'>
            <label for='name2' class='form-label enter'>Фамилия</label>
            <input type='name2' class='form-control enter' id='name2' placeholder='Введите фамилию'>
            <label for='email' class='form-label enter'>Электронная почта</label>
            <input type='email' class='form-control enter' id='email' placeholder='Введите почту'>                                    
            <label for='tg' class='form-label enter'>Ник в телеграм (не обязательно)</label>
            <input type='tg' class='form-control enter' id='tg' placeholder='@name'>
            <label for='num' class='form-label enter'>Номер телефона</label>
            <input type='num' class='form-control enter' id='num' placeholder='Введите номер телефона'>
            <label for='password' class='form-label enter'>Пароль</label>
            <input type='password' class='form-control enter' id='password' placeholder='Придумайте пароль'>  
            <input type='button' class='btn btn-dark enter' id='reg-button' value='Зарегестрироваться'>  
        </main>        


        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

        <script src={% static 'js/reg.js' %}></script>
