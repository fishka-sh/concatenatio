{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
        <link rel="stylesheet" href={% static 'css/enter.css' %}>
    </head>
    <body>

        {% csrf_token %}
        <main class='enter'>
            <label for='email' class='form-label'>Электронная почта</label>
            <input type='email' class='form-control' id='email' placeholder='Введите почту'>
            <label for='num' class='form-label'>Номер телефона</label>
            <input type='num' class='form-control' id='num' placeholder='Введите номер телефона'>
            <label for='password' class='form-label'>Пароль</label>
            <input type='password' class='form-control' id='password' placeholder='Введите пароль'>          
            <input type='button' class='btn btn-dark' id='enter-button' value='Войти'>
        </main>


        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <script src={% static 'js/enter.js' %}></script>
    </body>
</html>
